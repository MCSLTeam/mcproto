[workspace]
resolver = "3"
members = [
    "mcproto",
    "mcproto-codec",
    "mcproto-derive",
    "mcproto-oauth",
    "mcproto-types",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["MCSLTeam <services@mcsl.com.cn>"]
license = "MIT"
repository = "https://github.com/MCSLTeam/mcproto"

[workspace.dependencies]
fastnbt = "2.6.3"
base64 = "0.23.1"
bitflags = "2.13.1"
getrandom = "0.4.3"
mcproto-codec = { version = "0.4.0", path = "mcproto-codec" }
mcproto-derive = { version = "0.4.0", path = "mcproto-derive" }
mcproto-oauth = { version = "0.4.0", path = "mcproto-oauth" }
mcproto-types = { version = "0.4.0", path = "mcproto-types" }
proc-macro2 = "1.0.107"
quote = "1.0.47"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
serde_stacker = "0.1.14"
sha2 = "0.11.0"
thiserror = "2.0.20"
syn = { version = "2.0.119", features = ["full"] }
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt", "time"] }
url = "2.5.7"
uuid = { version = "1.17.1", default-features = false, features = ["std"] }
